<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Design Project 2(MOVEMENT)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/buzz/1.2.0/buzz.min.js"></script>
    <style>
 /* 
   I used a light blue gradient background to create a clean and calm
   visual style that does not distract from the icons. The icons are
   centred using flexbox, while the hover effect provides immediate
   visual feedback by scaling and changing the opacity. The movement
   animation uses a slow transition so the icon moves smoothly rather
   than suddenly
*/
        body {
            background: linear-gradient(135deg, rgb(244, 247, 251), rgb(170, 210, 250));
        }
        .row {
            display: flex;
            justify-content: center;
        }
        .icon {
            width: 300px;
        }
        .icon:hover {
            transform: scale(1.2);
            transition: transform 0.4s ease-in-out;
            cursor: pointer; 
            opacity: 0.7;
        }
        .icon img {
            transition: transform 8s ease-in-out;
        }
        .icon.move img {
            transform: translateX(300px);
        }
    </style>
</head>
<body>

<div class="row">
    <div class="icon"><img id="img1" src="img/walk.svg" height="250" width="250"></div>
    <div class="icon"><img id="img2" src="img/car.svg" height="250" width="250"></div>
    <div class="icon"><img id="img3" src="img/bicycle.svg" height="250" width="250"></div>
</div>
<div class="row">
    <div class="icon"><img id="img4" src="img/bus.svg" height="250" width="250"></div>
    <div class="icon"><img id="img5" src="img/airplane.svg" height="250" width="250"></div>
    <div class="icon"><img id="img6" src="img/tram.svg" height="250" width="250"></div>
</div>
<div class="row">
    <div class="icon"><img id="img7" src="img/scooter.svg" height="250" width="250"></div>
    <div class="icon"><img id="img8" src="img/train.svg" height="250" width="250"></div>
    <div class="icon"><img id="img9" src="img/ferry.svg" height="250" width="250"></div>
</div>

<script>
    var sound1 = new buzz.sound("sound/walk.mp3");
    var sound2 = new buzz.sound("sound/car.mp3");
    var sound3 = new buzz.sound("sound/bicycle.mp3");
    var sound4 = new buzz.sound("sound/bus.mp3");
    var sound5 = new buzz.sound("sound/airplane.mp3");
    var sound6 = new buzz.sound("sound/tram.mp3");
    var sound7 = new buzz.sound("sound/scooter.mp3");
    var sound8 = new buzz.sound("sound/train.mp3");
    var sound9 = new buzz.sound("sound/ferry.mp3");

    var currentSound = null;      
    var currentElement = null;    
    var animationTimeout = null;  

/* 
   This function controls the sound and movement of each icon.
   It stops the previous sound before playing the new one, so multiple
   sounds do not overlap.
*/
    function changeSound(newSound, newElement) {
    
        if (currentSound !== null) {
            currentSound.stop();
        }
        newSound.play(); 
        currentSound = newSound;

        if (currentElement !== null) {
            currentElement.classList.remove("move");
        }
        if (animationTimeout !== null) {
            clearTimeout(animationTimeout);
        }

        newElement.classList.add("move");
        currentElement = newElement;

        animationTimeout = setTimeout(function () {
            newElement.classList.remove("move");
            if (currentElement === newElement) {
                currentElement = null; 
            }
        }, 2500);
    }

    window.onload = function() {
        
        document.getElementById('img1').addEventListener('click', function () {
            changeSound(sound1, this.parentElement);
        });

        document.getElementById('img2').addEventListener('click', function () {
            changeSound(sound2, this.parentElement);
        });

        document.getElementById('img3').addEventListener('click', function () {
            changeSound(sound3, this.parentElement);
        });

        document.getElementById('img4').addEventListener('click', function () {
            changeSound(sound4, this.parentElement);
        });

        document.getElementById('img5').addEventListener('click', function () {
            changeSound(sound5, this.parentElement);
        });

        document.getElementById('img6').addEventListener('click', function () {
            changeSound(sound6, this.parentElement);
        });

        document.getElementById('img7').addEventListener('click', function () {
            changeSound(sound7, this.parentElement);
        });

        document.getElementById('img8').addEventListener('click', function () {
            changeSound(sound8, this.parentElement);
        });

        document.getElementById('img9').addEventListener('click', function () {
            changeSound(sound9, this.parentElement);
        });
    }
</script>
</body>
</html>
