<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Digital Design Project 2(MOVEMENT)</title>
     <script src="https://cdnjs.cloudflare.com/ajax/libs/buzz/1.2.0/buzz.min.js"></script>

</head>
<body>
    <style>
         body{background:linear-gradient(135deg, rgb(244, 247, 251),rgb(170, 210, 250));}

    .row {display: flex;
        justify-content: center;}

    .icon {width: 250px;}
    .icon:hover {transform: scale(1.2);
        transition: transform 0.4s ease-in-out;
        cursor: pointer; 
        opacity：0.7}
    .icon img {
    transition: transform 8s ease-in-out;
}

.icon.move img {
    transform: translateX(300px);
}
   
</style>
</body>
<div class="row">
    <div class="icon"><img id="img1" src="img/walk.svg" height="250" width="250"></div>
    <div class="icon"><img id="img2" src="img/car.svg" height="250" width="250"></div>
    <div class="icon"><img id="img3" src="img/bicycle.svg" height="250" width="250"></div>
</div>
<div class="row">
    <div class="icon"><img id="img4" src="img/bus.svg" height="250" width="250"></div>
    <div class="icon"><img id="img5" src="img/airplane.svg" height="250" width="250"></div>
    <div class="icon"><img id="img6" src="img/tram.svg" height="250" width="250"></div>
</div>
<div class="row">

    <div class="icon"><img id="img8" src="img/train.svg" height="250" width="250"></div>
    <div class="icon"><img id="img9" src="img/ferry.svg" height="250" width="250"></div>
</div>
<script>
     var sound1 = new buzz.sound("sound/walk.mp3");

   window.onload = function() {
        
    document.getElementById('img1').addEventListener('click', function () {
        sound1.play();

        setTimeout(function () {
            this.parentElement.classList.remove("move");}.bind(this), 2500);});

}
</script>
</html>
